# Builds an unsigned .ipa for a real iPhone on a macOS runner.
#
# Why this file can live in a throwaway fork: every step below checks out the
# upstream repository by name, so this workflow works from ANY fork (or even a
# bare repo with just this one file on main) without needing the iOS branch to
# be visible in the fork. Only the "Run workflow" button requires this file to
# be on the default branch, which is what we do.
#
# Nothing here uses secrets or an Apple account: the artifact is unsigned on
# purpose. Signing happens on the user's own machine (iloader / Sideloadly).
#
# Two builds, one switch — input `with_engine`:
#   false (default) → remote-only client. tooling/ios/prepare-engine.sh is not
#                     run, so DshNodeHost.framework / NodeMobile are absent and
#                     the ipa stays small. This is the build that is known to
#                     work on device.
#   true            → on-device engine. prepare-engine.sh composes NodeMobile
#                     24.22.1 + the runtime archive into app/ios/Engine/, and
#                     the Xcode phase embed-engine.sh compiles the three native
#                     frameworks and embeds them (~90 MB of Node, ~160 MB of
#                     runtime on first launch). --jitless, so no JIT entitlement
#                     is needed. EXPERIMENTAL: upstream says this path was still
#                     unverified on a real iPhone as of 2026-11-06.
name: iOS ipa (unsigned)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch or tag to build
        required: false
        default: feat/ios-foundation
        type: string
      with_engine:
        description: Embed the on-device engine (NodeMobile, experimental, much bigger ipa)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}-${{ inputs.upstream_ref }}-${{ inputs.with_engine }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      WITH_ENGINE: ${{ inputs.with_engine }}
    steps:
      - name: Check out the upstream iOS branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ccch1mneyyy/dsh-Go
          ref: ${{ inputs.upstream_ref }}
          persist-credentials: false

      - name: Show the toolchain
        run: |
          echo "building $GITHUB_REPOSITORY@$UPSTREAM_REF ($(git rev-parse --short HEAD))"
          echo "with_engine=$WITH_ENGINE"
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone
          python3 --version

      - name: Install Flutter
        run: |
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # Runs before the build: embed-engine.sh is an Xcode build phase and only
      # does its work when app/ios/Engine/.ready exists.
      - name: Prepare the on-device engine
        if: ${{ inputs.with_engine }}
        run: bash tooling/ios/prepare-engine.sh

      - name: Resolve dependencies
        run: |
          flutter --version
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      - name: Build for a device, unsigned
        working-directory: app
        run: bash ../tooling/ios/build.sh --release --no-codesign

      # Packaging is inlined on purpose: no second file has to exist on the
      # upstream branch, and the ipa layout is visible right here.
      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/app/build/ios/iphoneos/Runner.app"
          OUT="$GITHUB_WORKSPACE/dist"
          [ -d "$APP" ] || { echo "::error::no device build at $APP"; exit 1; }
          case "$(file -b "$APP/Runner")" in
            *Mach-O*arm64*) ;;
            *) echo "::error::$APP/Runner is not an arm64 Mach-O (simulator build?)"; exit 1 ;;
          esac
          mkdir -p "$OUT"

          # A remote-only build must not be mistaken for an engine build (and vice versa).
          if [ "$WITH_ENGINE" = "true" ]; then
            PREFIX=dsh-go-engine
            if [ ! -e "$APP/Frameworks/DshNodeHost.framework" ]; then
              echo "::error::with_engine=true but DshNodeHost.framework is missing from Runner.app"
              exit 1
            fi
          else
            PREFIX=dsh-go
            if [ -e "$APP/Frameworks/DshNodeHost.framework" ]; then
              echo "::error::with_engine=false but DshNodeHost.framework is present"
              exit 1
            fi
          fi

          package() {
            name="$1"; strip="$2"; work="$(mktemp -d)"
            mkdir -p "$work/Payload"
            cp -R "$APP" "$work/Payload/Runner.app"
            if [ "$strip" = yes ]; then
              rm -rf "$work/Payload/Runner.app/PlugIns"
            fi
            rm -f "$OUT/$name"
            ( cd "$work" && zip -qry "$OUT/$name" Payload )
            rm -rf "$work"
            printf '%-34s %10s bytes  sha256=%s\n' "$name" \
              "$(wc -c <"$OUT/$name" | tr -d ' ')" \
              "$(shasum -a 256 "$OUT/$name" | cut -d' ' -f1)"
          }

          package "$PREFIX-unsigned.ipa" no
          package "$PREFIX-unsigned-noshare.ipa" yes

          {
            echo '### ipa'
            echo
            echo "mode: **$([ "$WITH_ENGINE" = "true" ] && echo 'on-device engine' || echo 'remote only')**"
            echo
            echo '| file | bytes | sha256 |'
            echo '|---|---|---|'
            for f in "$OUT"/*.ipa; do
              echo "| $(basename "$f") | $(wc -c <"$f" | tr -d ' ') | $(shasum -a 256 "$f" | cut -d' ' -f1) |"
            done
            echo
            echo '### payload check'
            echo
            for item in Frameworks/DshNodeHost.framework Frameworks/NodeMobile.framework \
                        Frameworks/DshFlock.framework Frameworks/DshRequireBuiltin.framework \
                        dsh-runtime PhoneSelfRunner Frameworks/App.framework; do
              if [ -e "$APP/Resources/$item" ] || [ -e "$APP/$item" ]; then
                echo "- present: $item"
              else
                echo "- absent: $item"
              fi
            done
            echo "- Runner.app: $(du -sm "$APP" | cut -f1) MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-go-ipa-${{ inputs.with_engine && 'engine' || 'remote' }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30
